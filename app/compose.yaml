services:
  app:
    build: . 
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: bourbon
      DB_PASSWORD: localdev
      DB_NAME: bourbon
    depends_on:
      - db

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: bourbon
      MARIADB_USER: bourbon
      MARIADB_PASSWORD: localdev
      MARIADB_ROOT_PASSWORD: localroot
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
