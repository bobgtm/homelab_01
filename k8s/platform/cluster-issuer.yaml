# Free, auto-renewing HTTPS certificates from Let's Encrypt (cert-manager).
# Ingresses opt in with the annotation  cert-manager.io/cluster-issuer: letsencrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
